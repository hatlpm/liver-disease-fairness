# Parámetros del experimento de la Actividad 2 (Fases 4-9).
#
# Fuente única de verdad para todo número que no sea una constante de dominio
# (esas van en src/config.py). Ver PRD_liver_disease_act2_fases_4-9.md §11.
#
# Fase 4 consume solo `seed` y `split`. Las demás secciones (preprocessing,
# balancing, cv, metrics, feature_selection, grids) pertenecen a fases
# posteriores (5-9) pero se declaran completas desde ahora, según el
# contenido mínimo obligatorio del PRD §11.2 -- así ninguna fase futura
# necesita decidir un número por su cuenta.

seed: 42

split:
  test_size: 0.2
  stratify_by: ["Selector", "Gender"]
  indices_path: "data/processed/split_indices.json"

preprocessing:
  imputer: {strategy: "median", add_indicator: true}
  scalers: ["minmax", "zscore"]
  scale_indicator: false

balancing:
  methods: ["none", "smote"]
  smote: {k_neighbors: 5}

cv:
  tuning: {n_splits: 5, shuffle: true}
  fairness: {n_splits: 5, n_repeats: 10}

metrics:
  average: "binary"
  pos_label: 1
  # ADR-0012: la clase positiva (Selector=1, enfermo) es la MAYORITARIA
  # (71% de train). Con "f1"/pos_label=1, el clasificador que responde
  # "todos enfermos" saca F1=0.83 sin haber aprendido nada -- ver el suelo
  # nulo calculado en 06_modelos.ipynb. "balanced_accuracy" no tiene ese
  # suelo (0.50 = azar en cualquier split) y es la metrica de SELECCION de
  # hiperparametros; accuracy/precision/recall/F1 se siguen reportando tal
  # como exige T6/T7 (cambia el criterio de seleccion, no lo que se informa).
  optimize_for: "balanced_accuracy"
  decision_threshold: 0.5

# Configuracion fija bajo la que se ajustan los hiperparametros de la Fase 6.
# Si se reajustaran dentro de cada celda del factorial de la Fase 8, el
# efecto del escalado quedaria confundido con el efecto de volver a ajustar
# -- T8 pregunta por el efecto del preprocesamiento aislado. Justificacion
# completa (por que zscore+smote y no otra combinacion) en
# notebooks/06_modelos.ipynb.
tuning_baseline:
  scaler: "zscore"
  balancing: "smote"

feature_selection:
  enabled: true
  method: "selectkbest"
  k_values: [5, 7, 10]
  include_gender: [true, false] # F6A-R4: ambas variantes obligatorias

# Fase 7 (F7-R7/R8): parametros de evaluacion sobre el test congelado.
# El umbral OFICIAL de la tabla T7 sigue siendo metrics.decision_threshold
# (0.5) -- threshold_grid y screening_min_recall solo alimentan la seccion
# de exploracion de umbral, que corre exclusivamente sobre train/CV
# (Trampa 3 del encargo, nunca sobre test). Ver ADR-0014.
evaluation:
  bootstrap:
    n_iterations: 2000 # regla practica de Efron para un IC percentil estable
    confidence_level: 0.95
  threshold_grid: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  screening_min_recall: 0.90 # decision de producto citada explicitamente en el notebook

grids: # B1: fijas de antemano, no improvisadas en el notebook
  logistic_regression:
    C: [0.01, 0.1, 1, 10, 100]
    solver: ["liblinear", "saga"]
  knn:
    n_neighbors: [3, 5, 7, 9, 11, 15]
    weights: ["uniform", "distance"]
  gaussian_nb:
    var_smoothing: [1.0e-11, 1.0e-9, 1.0e-7]
  decision_tree:
    max_depth: [3, 5, 7, 10, null]
    min_samples_leaf: [1, 5, 10]
    criterion: ["gini", "entropy"]
  svm:
    C: [0.1, 1, 10]
    kernel: ["linear", "rbf"]
    gamma: ["scale", "auto"]
